title: "JieJie's Compiler Journey"
description: "记录编译技术、AI编译器以及LLM的学习过程，分享实现细节和技术心得"
baseurl: "/Cminusf-Compiler"
url: ""

author:
  name: "jie"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
